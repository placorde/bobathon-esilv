# Minimal pyproject.toml for the Parkinson's UPDRS ML workspace.
#
# Declares src/parkinsons/ as an installable, editable package so
# `from parkinsons.pipeline import build_learner` works from any CWD.
# Runtime dependencies live in requirements.txt — this file only
# describes the package layout.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinsons"
version = "0.1.0"
description = "Workspace package for the Parkinson's UPDRS score prediction experiments."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
